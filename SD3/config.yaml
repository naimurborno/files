# ── Active model ────────────────────────────────────────────────────
model_name: "sd3_ugile"
model_id:   "stabilityai/stable-diffusion-3-medium-diffusers"


# ── Device & seed ────────────────────────────────────────────────────
device: "cuda"
seed:   41

# ── Multi-seed generation ────────────────────────────────────────────
seeds:
  - 41
  # - 42
  # - 43
  # - 44
  # - 45

prompts_file: "prompts.yaml"

negative_prompt: "blurry, low quality, ugly, deformed"

output: "prompt20.png"

# NOTE: separate output dirs so this run doesn't overwrite your full-method results
diverse_output_dir:  "outputs/diverse"
original_output_dir: "outputs/original"

generation:
  height: 512
  width:  512

flow:
  num_steps:      50
  guidance_scale: 6.0
  solver:         "euler"
  t_start:        1.0
  t_end:          0.0

model_kwargs: {}
save_trajectory: false

ugile:
  num_grad_steps:      50
  sigma_lo:            -1.0
  sigma_hi:            1.0
  escape_scale:        1.0
  theta_max:           0.75      # ← keep IDENTICAL to your full-method config
  walk_steps:          10
  branch_noise:        0.7
  J:                   1
  noise_scale:         8.0       # ← keep IDENTICAL to your full-method config
  diverse_output_dir:  "outputs/diverse_ablationA"
  original_output_dir: "outputs/original_ablationA"
  save_original:       true

  # ── ABLATION A ────────────────────────────────────────────────────
  # false = skip the 3-step power iteration; use a random direction
  #         (orthogonalized against the semantic direction) instead of
  #         the covariance-refined v_boundary.
  use_power_iteration: true