model_name: "pixart_sigma_ugile"
model_id:   "futurefrompast/pixart-alpha-512"

device: "cuda"
seed:   41
seeds: [41, 42, 43, 44, 45]

prompts_file: "prompts.yaml"

negative_prompt: ""

output: "prompt_pixart.png"

generation:
  height: 512
  width:  512

flow:
  num_steps:      50
  guidance_scale: 4

ugile:
  sigma_lo:     -1.0
  sigma_hi:     1.0
  theta_max:    2.0
  noise_scale:  15
  diverse_output_dir:  "outputs/diverse"
  original_output_dir: "outputs/original"
  save_original: true
